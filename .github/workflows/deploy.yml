name: Deploy website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::535387297859:role/github-actions-oicd-interfacespecs
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync ./site s3://interface-specifications-site-535387297859-us-east-2-an --delete